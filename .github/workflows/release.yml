# タグ(v*)の push で両OSの配布 zip をビルドして GitHub Releases へ公開する。
# ビルドは CI 上で公開コードから行われるため、配布物の再現性の担保になる
# (署名なし OSS の標準形。Mac は ad-hoc 署名、Windows は未署名)。
# 将来コード署名を導入する場合は各 package スクリプトの環境変数
# (KNIT_SIGN_IDENTITY / KNIT_NOTARY_PROFILE 等)を Secrets へ登録する。
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/package-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            dist/Knit-*.zip
            dist/Knit-*.zip.sha256
  windows:
    # Windows 用も macos runner から x86_64-pc-windows-gnu へクロスビルドする
    # (ローカル開発と同一手法)。ring(snow の依存)の C 部分に mingw の
    # コンパイラが必要なため brew で入れる
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - run: bash scripts/package-win.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/Knit-win-*.zip
            dist/Knit-win-*.zip.sha256
  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist-all
      - name: 署名付き更新情報(update.json)を作る
        # 署名鍵(Ed25519 の秘密鍵を16進で)はこのステップにだけ渡す。未登録なら update.json は作らない
        env:
          KNIT_UPDATE_SIGNING_KEY: ${{ secrets.KNIT_UPDATE_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${KNIT_UPDATE_SIGNING_KEY}" ]; then echo '署名鍵が未登録のため update.json は作りません'; exit 0; fi
          trap 'rm -f "$RUNNER_TEMP/update.key"' EXIT
          VER="${TAG#v}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          (umask 077; printf '%s' "$KNIT_UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update.key")
          cargo run -q --locked -p knit-common --bin knit-sign -- manifest "$VER" stable \
            "macos-arm64=dist-all/Knit-${VER}.zip=${BASE}/Knit-${VER}.zip" \
            "windows-x64=dist-all/Knit-win-${VER}.zip=${BASE}/Knit-win-${VER}.zip" \
            > dist-all/update.json
          cargo run -q --locked -p knit-common --bin knit-sign -- sign "$RUNNER_TEMP/update.key" dist-all/update.json \
            > dist-all/update.json.sig
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-all/*
          generate_release_notes: true
