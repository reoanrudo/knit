# push / PR ごとに検証する。タグ公開(release.yml)より前に壊れた変更を止めるための最小の門。
# Windows はネイティブの windows-latest で実行する(配布物のビルドは release.yml 側)。
name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude knit-win
      # 性能の壊滅的な回帰(10倍級)だけを検出する。閾値はマシン差を吸収するため
      # 緩い下限/上限にしてある(数十%の比較は同じマシンで前後を測ること)
      - name: benchmarks (regression guard)
        run: bash scripts/bench.sh --check
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p knit-common -p knit-win
