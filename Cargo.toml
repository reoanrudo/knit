[workspace]
resolver = "2"
default-members = ["crates/common", "crates/mac"]
members = ["crates/common", "crates/mac", "crates/win"]

[workspace.package]
version = "0.26.0"
edition = "2021"
description = "Mac⇄Windows 入力共有ツール(knit): CGEventTap→TCP→SendInput"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
